name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ask Pages where this repo is served (its default address, e.g.
      # https://arvinduh.github.io/zisha) so the build's links match it.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Point the build at the Pages address
        run: |
          echo "SITE=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
      # Runs `npm run build` (astro check + astro build) and uploads dist/.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
