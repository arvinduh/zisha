# Seasoning a new pot (开壶). Follows the pot maker's gentle "warm awakening"
# method (dxyzisha.com/use-care-guide) rather than the old boiling method.

title: Wake up the pot
hanzi: 开壶
summary: >-
  Do this once, before the pot's first brew. About 40 minutes of hands-on time,
  then a few hours of cooling while you get on with your day.
needs:
  - The teapot and its lid
  - A clean basin or pot big enough to submerge the teapot, never used for oily food
  - Kettle and a thermometer (or a temperature-set kettle)
  - A small handful (3-5 g) of the Bai Mudan

steps:
  - do: This pot is for the Bai Mudan.
    how: >-
      You'll use a little of it in step 4. From then on, only the Bai Mudan
      goes in this pot; every other tea goes in the gaiwan.
    why: >-
      The clay remembers. Seasoning with a tea starts that memory, and zhuni,
      dense as it is, keeps a light tea's aroma clean.

  - do: Rinse the pot and lid in room-temperature water.
    how: >-
      Inside and out. Run a fingertip over the strainer holes at the base of
      the spout to clear any loose clay grit.
    why: >-
      Kiln dust and fine grit sit on a new pot. Lukewarm or cool water is
      gentle; hot water on a cold, dry pot is the first thermal shock you're
      avoiding.
    warn: No soap, not even now. The clay would keep it.

  - do: Soak pot and lid in 80 °C water for 20 minutes.
    how: >-
      Put the pot and lid side by side in the clean basin. Cover them with
      lukewarm water (40-50 °C) for a couple of minutes first, pour that off,
      then fill with 80 °C water until both are fully under.
    why: >-
      Gentle, even heat opens the pores and lets the clay settle without
      stress. It's the safe version of the traditional boil, and the lukewarm
      step spares zhuni, the most heat-sensitive clay, a sudden jump.
    warn: >-
      Don't boil the pot. Rolling water can knock the pot around and cause
      hairline cracks. Skip old recipes that add tofu or sugarcane; they can
      leave residue that molds.
    timer: 1200

  - do: Add the tea, then cover everything with boiling water.
    how: >-
      Drop the leaves into the pot. Fill the pot, then top up the basin, all
      with freshly boiled water, until pot and lid are covered again.
    why: >-
      The pot is already warm, so boiling water is safe now. As it all cools,
      the clay drinks in its first tea.

  - do: Leave it to cool on its own, a few hours or overnight.
    how: Don't add cold water or move it to speed things up.
    why: >-
      Slow cooling soaks the clay evenly. A fast temperature drop is exactly
      what cracks pots.

  - do: Empty it and rinse with hot water.
    how: Tip out the leaves and rinse the pot and lid with just-boiled water.
    why: Leaves left behind start to sour.

  - do: Brew now, or let it air-dry with the lid off.
    how: >-
      No towel. If you're not brewing today, leave it somewhere open for 24-48
      hours before it goes back in its case.
    why: >-
      Clay holds water deep in its pores. Closing it up damp is the most
      common cause of a musty pot.
