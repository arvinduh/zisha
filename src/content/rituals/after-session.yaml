# The cleanup after every session, following the pot maker's advice: rinse,
# then dry open in the air, no towel.

title: After every session
hanzi: 收壶
summary: Five minutes, and the whole secret to a pot that ages well.
steps:
  - do: Empty the leaves right away.
    how: >-
      Tip them out (they make good compost) and swirl out the last bits with a
      splash of water.
    why: >-
      Tea pooled in the pot leaves dark, uneven stains, and wet leaves left
      overnight go sour and grow mold.

  - do: Rinse everything with just-boiled water.
    how: >-
      The pot and its lid, then the gaiwan, pitcher, and cups. Pour some
      through the pot's spout too.
    why: >-
      Boiling water dissolves the tea film without chemicals and clears leaf
      bits out of the spout's filter holes. Rinsing while the pot is still warm
      means no thermal shock.
    warn: No soap, ever, on the zisha pot.

  - do: Let it air-dry, lid off. Don't towel it.
    how: >-
      Shake off the last drops and set the pot and its lid side by side
      somewhere open and airy.
    why: >-
      This is the pot maker's own advice. The pot's heat and the air dry it
      evenly inside and out; rubbing it with a cloth isn't needed and can leave
      lint or smudges on zhuni's smooth skin.

  - do: Only back in its case once it's bone-dry.
    how: Give it a full day or two in the open first.
    why: >-
      Clay holds water deep inside. A closed case traps that moisture, and a
      damp pot in a closed box is how mold starts.
